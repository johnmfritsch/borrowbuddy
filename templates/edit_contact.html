{% extends "base.html" %}

{% block title %}Edit Contact{% endblock %}

{% block page_title %}<h2 class="fw-bold" style="font-size: 1.6rem; color: #1a3a5c; margin: 0; flex: 1; text-align: center;">Edit Contact</h2>{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">

        {% if request.args.get('error') %}
        <div class="alert alert-danger alert-dismissible fade show">
            {{ request.args.get('error') }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        <form method="POST" class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="name" class="form-label">Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="name" name="name" value="{{ contact.name }}" required>
                <div class="invalid-feedback">
                    Please enter a name.
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ contact.email if contact.email else '' }}">
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input type="tel" class="form-control" id="phone" name="phone" value="{{ contact.phone if contact.phone else '' }}">
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Update Contact</button>
                <a href="{{ url_for('contacts') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Form validation
(function() {
    'use strict';
    var forms = document.querySelectorAll('.needs-validation');
    Array.prototype.slice.call(forms).forEach(function(form) {
        form.addEventListener('submit', function(event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);
    });
})();
</script>
{% endblock %}
